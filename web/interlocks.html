<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Interlocks</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a aria-current="page" href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Interlock control</h1><div class="muted">Mutual exclusion, emergency equipment and device connectivity</div></div></div><div class="grid" id="interlock-grid"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,setMessage,withBusy}=window.LockFlow; const host=document.querySelector('#interlock-grid'); const message=document.querySelector('#message');
const stateLabel={online:'Online',offline:'Offline',unknown:'Unknown'};
const stateClass={online:'ok',offline:'critical',unknown:'warning'};
const deviceRows=(devices)=>((devices||[]).map((d)=>`<tr><td>${d.device}</td><td><span class="badge ${stateClass[d.state]||'warning'}">${stateLabel[d.state]||'Unknown'}</span></td><td>${d.observation?.status||'-'}</td><td>${d.last_observed_at?new Date(d.last_observed_at).toLocaleTimeString():'no heartbeat'}</td><td>${d.message||''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No telemetry</td></tr>');
async function stop(chamber,button){await withBusy(button,async()=>{try{await api(`/api/chambers/${chamber}/emergency`,{method:'POST',body:'{}'});await load();}catch(e){setMessage(message,e.message);}});}
async function load(){const data=await api('/api/interlocks');host.innerHTML=Object.entries(data).filter(([id])=>id!=='signal_handoffs').map(([id,item])=>`<section class="panel"><h2>${id}</h2><table><tr><th>Emergency</th><td>${item.emergency.status}</td></tr><tr><th>Level</th><td>${item.equipment.LevelM??item.equipment.level_m??0} m</td></tr><tr><th>Pending commands</th><td>${item.pending_commands.length}</td></tr></table><h3>Devices</h3><table><thead><tr><th>Device</th><th>Connectivity</th><th>State</th><th>Observed</th><th>Note</th></tr></thead><tbody>${deviceRows(item.devices)}</tbody></table><button class="danger" data-stop="${id}">Emergency stop</button></section>`).join('');host.querySelectorAll('[data-stop]').forEach((button)=>button.addEventListener('click',()=>stop(button.dataset.stop,button)));setMessage(message,'');}
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
